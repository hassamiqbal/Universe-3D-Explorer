name: Finalize notebook

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct notebook
        shell: bash
        run: |
          cat .notebook-build/part00.b64 .notebook-build/part01.b64 .notebook-build/part23.b64 .notebook-build/part45.b64 .notebook-build/part67.b64 | base64 -d | gunzip > Universe_3D_Explorer.ipynb
          python - <<'PY'
          import json
          with open('Universe_3D_Explorer.ipynb', encoding='utf-8') as f:
              nb = json.load(f)
          assert nb.get('nbformat') == 4
          assert isinstance(nb.get('cells'), list) and nb['cells']
          print(f"validated {len(nb['cells'])} cells")
          PY
          rm -rf .notebook-build
      - name: Commit notebook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cleaned Universe 3D Explorer notebook" || exit 0
          git push
